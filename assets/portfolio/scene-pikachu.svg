<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <radialGradient id="weld-aura"><stop stop-color="#ffdf56" stop-opacity=".75"/><stop offset="1" stop-color="#ffdf56" stop-opacity="0"/></radialGradient>
    <filter id="bolt-glow" x="-65%" y="-30%" width="230%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.1"/></filter>
    <linearGradient id="lens" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#244875"/><stop offset="1" stop-color="#101f3c"/></linearGradient>
  </defs>
  <style>
    .arc{opacity:.81}.glow{opacity:.78}.spark{opacity:.77}
    @media(prefers-reduced-motion:no-preference){.arc,.glow{animation:weld 3s linear infinite}.spark{animation:sparks 3s linear infinite}}
    @keyframes weld{0%,37%,74%,100%{opacity:0}42%,66%{opacity:1}}
    @keyframes sparks{0%,40%,77%,100%{opacity:0;transform:translateY(1px)}46%,67%{opacity:.9;transform:translateY(-2px)}}
  </style>
  <g fill="none" stroke="#8298bd" stroke-width="1" opacity=".6"><path d="M52 147h196m-182 9h163m13 0h10"/><ellipse cx="146" cy="142" rx="94" ry="10"/></g>
  <circle class="glow" cx="196" cy="89" r="32" fill="url(#weld-aura)"/>
  <g stroke="#382d43" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Lightning bolt tail, above and behind the ears. -->
    <path d="m120 116-16-7 1-8L67 88l22-31 17 10 24-15-12-16 40-19 16 12-32 13 10 13-47 29-12-8-9 11 28 10-1 8 13 4Z" fill="#ffd44e"/>
    <path d="m111 105-1 4 10 7 4-7Z" fill="#a96b3d"/>
    <path d="m127 35 30-14 10 7" fill="none" stroke="#fff09d" stroke-width="1.5"/>
    <!-- Exactly two hind legs: one near (light), one far (shaded). -->
    <path d="M139 122q6-9 15-6l5 11 9 3q8 5 3 9h-19q-5-2-6-8Z" fill="#ddb33e"/>
    <path d="M135 86q-19 5-24 19-6 16 7 26 8 6 22 2l15-5q6-7 5-19-1-16-14-21Z" fill="#ffcf48"/>
    <path d="m111 104 12 5-12 4m1 6 12 4-7 4" fill="#b77b42" stroke="none"/>
    <path d="M131 120q-11 0-12 13v5l-6 2q-4 4 3 5h20q8-1 6-5-1-3-10-4l2-8" fill="#ffe269"/>
    <path d="M123 141h4m3 0h4m28-6h5" stroke="#8a5d43" stroke-width="1.1"/>
    <!-- Far and near pointed ears. -->
    <path d="M132 65q-3-19 8-38 4-7 7-5 4 3 2 12l-1 29" fill="#eebd43"/>
    <path d="M140 27q4-7 7-5 4 3 2 12l-1 5-11-2Z" fill="#382d43"/>
    <path d="M122 69q-13-10-22-37-2-7 3-5 12 5 24 20l9 14" fill="#ffda58"/>
    <path d="M100 32q-2-7 3-5 8 3 14 9l-10 9Z" fill="#382d43"/>
    <!-- Far paw supports the back of the tab. -->
    <path d="M153 104q8 2 16-4l7-5q4-2 6 2 0 4-5 6l-8 5q-9 5-14 2" fill="#eab73e"/>
    <!-- Right-facing head and small muzzle. -->
    <path d="M113 72q8-16 28-17 17-1 25 12l6 9 9 5q1 4-7 8-7 11-25 12-21 1-33-12-5-6-3-17Z" fill="#ffdc58"/>
    <path d="M176 80l5 1-1 3-5 1Z" fill="#382d43" stroke="none"/>
    <path d="M165 89q4 2 8-1" fill="none" stroke-width="1.6"/>
    <circle cx="151" cy="89" r="7" fill="#ef5147" stroke="#b73e3d" stroke-width="1.15"/>
    <!-- Layered wraparound welding frame, strap, lens and directional glint. -->
    <path d="M116 71q11 5 26 3l1 7q-13 2-26-2Z" fill="#46516a" stroke-width="1.3"/>
    <path d="m127 76 8 1m-8 1 7 1" stroke="#a8bdd8" stroke-width="1"/>
    <path d="M138 68q15-6 28-2l5 8-2 8-19 3-11-6Z" fill="#88a6b8" stroke="#273555" stroke-width="2"/>
    <path d="M143 71q14-4 21-2l4 6-2 4-15 3-8-4Z" fill="url(#lens)" stroke="#283853" stroke-width="1.3"/>
    <path d="m147 72 5 5m3-6 7 6m1-5 2 2" stroke="#9be8ee" stroke-width="1.35"/>
    <circle cx="162" cy="77" r="1.35" fill="#d8fdde" stroke="none"/>
    <path d="M140 71v7m28-6 3 1" fill="none" stroke="#d9e8ef" stroke-width="1"/>
    <!-- Workpiece: a tiny L-shaped bracket brazed at the far corner. -->
    <path d="m171 94 19-4 7 3 5-5 8 3-7 7-26 5-6-3Z" fill="#c0cddc" stroke="#354566" stroke-width="1.8"/>
    <path d="m173 96 7 3 22-5 7-3m-18 0 2 6" fill="none" stroke="#657a9d" stroke-width="1.15"/>
    <circle cx="184" cy="96" r="1.3" fill="#eef8ff" stroke="#637a9a" stroke-width=".85"/>
    <!-- Near stubby forearm and two finger nubs crossing the bracket. -->
    <path d="M151 104q8 2 13-2l6-4q3-2 5 0l2 1q0 5-5 6l-6 4q-8 4-15 2" fill="#ffe270"/>
    <path d="m171 101 3-2m-1 4 3-2" stroke="#a66944" stroke-width=".8"/>
  </g>
  <!-- A fixed weld path attaches to the actual tail tip and joint. -->
  <g class="arc" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m174 29-4 16 12 1-3 13 13 1-4 16 11-1-5 12 3 6" stroke="#ffdf3c" stroke-width="7.5" opacity=".82" filter="url(#bolt-glow)"/>
    <path d="m174 29-4 16 12 1-3 13 13 1-4 16 11-1-5 12 3 6" stroke="#a85b06" stroke-width="4.5"/>
    <path d="m174 29-4 16 12 1-3 13 13 1-4 16 11-1-5 12 3 6" stroke="#ffdf34" stroke-width="2.8"/>
    <circle cx="197" cy="93" r="1.9" fill="#fff7c0" stroke="#f2be49" stroke-width="1"/>
  </g>
  <g class="spark" fill="none" stroke="#efb848" stroke-width="1.65" stroke-linecap="round">
    <path d="m191 87-6-3m21 3 6-6m-9 13 8 4m-13 4 2 6m-9-14-6 3"/>
    <path d="M217 75v6m-3-3h6m-3 27v6m-3-3h6" stroke="#ffd457"/>
  </g>
</svg>
