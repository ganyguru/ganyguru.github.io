<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <style>
    .ember{transform-origin:242px 117px}
    @media(prefers-reduced-motion:no-preference){.ember{animation:flicker 2.1s ease-in-out infinite}}
    @keyframes flicker{0%,100%{transform:rotate(-3deg) scaleY(.97)}50%{transform:rotate(3deg) scaleY(1.06)}}
    @supports (d: path("M0 0 L1 1")){
      @media(prefers-reduced-motion:no-preference){
        .lift-assembly{animation:press-bar 3.4s ease-in-out infinite}
        .press-arm{animation:press-arm 3.4s ease-in-out infinite}
        .arm-crease{animation:press-crease 3.4s ease-in-out infinite}
      }
    }
    @keyframes press-bar{0%,13%,90%,100%{transform:translateY(0)}43%,53%{transform:translateY(-22px)}}
    @keyframes press-arm{0%,13%,90%,100%{d:path("M123 93 Q111 96 100 84 Q92 75 93 62 L97 48 L107 49 L106 65 L115 76 Q127 77 131 87 Z")}43%,53%{d:path("M123 93 Q110 91 102 78 Q92 62 93 45 L97 26 L107 27 L107 46 L115 67 Q126 74 131 87 Z")}}
    @keyframes press-crease{0%,13%,90%,100%{d:path("M100 68 Q106 79 117 80")}43%,53%{d:path("M100 51 Q108 68 117 72")}}
  </style>
  <ellipse cx="149" cy="158" rx="111" ry="11" fill="#849bd2" opacity=".2"/>
  <g stroke="#382e49" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two tall teal wings behind the lifter. -->
    <path d="M123 116Q91 58 45 50l12 41-13 25 22-6 13 23 20-9 23 10Z" fill="#3699a2"/>
    <path d="M178 116q31-58 77-66l-12 41 13 25-22-6-13 23-20-9-23 10Z" fill="#3699a2"/>
    <path d="m45 50 50 51-29 9m29-9 4 23m156-74-50 51 29 9m-29-9-4 23" fill="none" stroke="#52c2bc"/>
    <path d="M45 50q49 4 78 66M255 50q-48 4-77 66" fill="none" stroke="#ec823b" stroke-width="4"/>
    <!-- Tail and flame. -->
    <path d="M159 141q24 17 54 5 22-10 28-28l-9-3q-7 13-25 17-20 6-31-5Z" fill="#df7838"/>
    <g class="ember"><path d="M235 122q-8-7-1-18 2 4 5 3 0-9 9-14-2 8 4 12 7 10-6 17Z" fill="#ee5746"/><path d="M239 119q-4-4 0-9l3 2q0-5 4-9 0 5 3 8 3 7-4 8Z" fill="#ffd34d" stroke="none"/></g>
    <!-- Braced feet, thighs and broad chest. -->
    <path d="M135 122q-20-3-27 15l-4 9-10 4q-4 6 4 8h29q7-1 7-8l5-14m24-14q20-3 27 15l4 9 10 4q4 6-4 8h-29q-7-1-7-8l-5-14" fill="#ef8b43"/>
    <path d="M129 92q-17 3-19 18 0 18 16 22l11 8h26l11-8q16-4 16-22-2-15-19-18Z" fill="#f29a47"/>
    <path d="M139 105q-14 7-10 20 6 14 21 14 15 0 21-14 4-13-10-20Z" fill="#ffe2a0"/>
    <path d="M125 107q11-10 24 1m26-1q-11-10-24 1m-11 12q10 4 20 0m-19 8h18" fill="none" stroke="#ba5f34" stroke-width="1.4"/>
    <path d="m101 154 3-4 4 4m4 0 4-4 4 4m60 0 4-4 4 4m4 0 4-4 4 4" fill="#fff5d8" stroke-width="1"/>
    <!-- Arms share the plate and grip assembly's lift timing. -->
    <g>
      <path class="press-arm" d="M123 93 Q111 96 100 84 Q92 75 93 62 L97 48 L107 49 L106 65 L115 76 Q127 77 131 87 Z" fill="#ff9844"/>
      <path class="arm-crease" d="M100 68 Q106 79 117 80" fill="none" stroke="#b75f35" stroke-width="1.5"/>
    </g>
    <g transform="translate(300 0) scale(-1 1)">
      <path class="press-arm" d="M123 93 Q111 96 100 84 Q92 75 93 62 L97 48 L107 49 L106 65 L115 76 Q127 77 131 87 Z" fill="#ff9844"/>
      <path class="arm-crease" d="M100 68 Q106 79 117 80" fill="none" stroke="#b75f35" stroke-width="1.5"/>
    </g>
    <g class="lift-assembly">
    <path d="M65 46h170" stroke="#354465" stroke-width="6"/>
    <path d="M66 45h168" stroke="#c4d2e8" stroke-width="1.5"/>
    <g fill="#334978"><rect x="70" y="29" width="13" height="34" rx="4"/><rect x="82" y="25" width="13" height="42" rx="4"/><rect x="205" y="25" width="13" height="42" rx="4"/><rect x="217" y="29" width="13" height="34" rx="4"/></g>
    <path d="M86 33v26m128-26v26" stroke="#799ad5" stroke-width="1.5"/>
    <path d="M96 52q-5-8 0-11l8-1q7 1 5 8l-2 5Zm108 0q5-8 0-11l-8-1q-7 1-5 8l2 5Z" fill="#ffad54"/>
    <path d="M98 43v5m4-5v5m100-5v5m-4-5v5" stroke="#9b5937" stroke-width="1"/>
    </g>
    <!-- Charizard's horns, muzzle and tied headband with small ball emblem. -->
    <path d="M132 71l-5-17q8 1 15 12m26 5 5-17q-8 1-15 12" fill="#f8833f"/>
    <path d="M129 78q0-13 18-15h6q18 2 18 15l-5 11q4 4 1 10-8 8-17 8-10 0-17-8-3-6 1-10Z" fill="#ff9c48"/>
    <path d="M134 92q16-8 32 0-2 11-16 12-13 0-16-12Z" fill="#ffd996"/>
    <path d="m136 83 9 3m19-3-9 3m-13 9 2 1m12 0 2-1" fill="none" stroke="#573046" stroke-width="1.65"/>
    <path d="M167 70q10-5 16-3l-5 5 8 4q-10 2-18-3" fill="#fff8e6" stroke-width="1.45"/>
    <path d="M129 69q19-6 42 0l-1 10q-20-3-40 0Z" fill="#fff8e6" stroke-width="1.55"/>
    <circle cx="150" cy="73" r="5" fill="#fffdf3" stroke-width="1.1"/>
    <path d="M145 73a5 5 0 0 1 10 0z" fill="#ef493a" stroke-width=".95"/>
    <path d="M145 73h10" stroke-width="1.1"/>
    <circle cx="150" cy="73" r="1.6" fill="#fffdf3" stroke-width=".8"/>
  </g>
</svg>
